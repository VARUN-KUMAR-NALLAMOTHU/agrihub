{% extends "base.html" %}
{% block title %}Log in | AgriHub{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-art" aria-hidden="true">
    {% for s in all_soils %}<i style="--bg:{{ soil_colors[s][0] }}"></i>{% endfor %}
  </div>
  <div class="auth-form">
    <h1>Welcome back</h1>
    <p class="muted">Log in to plan your next crop.</p>
    <form method="post">
      <label class="field">Email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <p class="alt">New to AgriHub? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
