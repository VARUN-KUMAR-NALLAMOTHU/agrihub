{% extends "base.html" %}
{% block title %}Create account | AgriHub{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-art" aria-hidden="true">
    {% for s in all_soils %}<i style="--bg:{{ soil_colors[s][0] }}"></i>{% endfor %}
  </div>
  <div class="auth-form">
    <h1>Create your account</h1>
    <p class="muted">We email you a six-digit code to confirm your address.</p>
    <form method="post">
      <label class="field">Full name<input name="name" autocomplete="name" required></label>
      <label class="field">Email<input type="email" name="email" autocomplete="email" required></label>
      <label class="field">Password <span class="hint">at least 8 characters</span>
        <input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
      <button class="btn primary" type="submit">Send verification code</button>
    </form>
    <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
